# Render Blueprint — deploy: dashboard → New → Blueprint → select repo.
# Secrets (sync: false) are filled in the Render dashboard on first deploy.

services:
  - type: web
    name: resume-analyzer-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMAIL_FROM_NAME
        value: CareerLens AI
      - key: S3_BUCKET_NAME
        value: careerlens-prod
      - key: S3_REGION
        value: auto
      # ── Fill these in Render dashboard (Environment tab) ──
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: resume-analyzer-db
    databaseName: resume_analyzer
    user: resume_analyzer
    plan: free
